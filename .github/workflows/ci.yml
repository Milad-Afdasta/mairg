name: validate
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q mairg examples comparison
      - run: mypy mairg
      - run: ruff check mairg tests examples comparison
      - run: python -m mairg check examples/inventory
      - run: python -m mairg test examples/inventory
      - run: python -m mairg check examples/changelog
      - run: python -m mairg test examples/changelog
