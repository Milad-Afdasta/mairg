[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mairg"
version = "0.2.0"
description = "A practical proof of concept for machine-authored application graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Milad Afdasta"}]
dependencies = ["waitress==3.0.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
mairg = "mairg.cli:main"

[tool.setuptools]
packages = ["mairg"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
